[project]
name = "agnos-class"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno==2",
    "chonkie>=1.7.0",
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "fastapi>=0.162.1",
    "groq>=1.7.0",
    "openai>=3.46.0",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[project.scripts]
agnos-class = "agnos_class:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
